{% set name = "durationpy" %}
{% set version = "0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/icholy/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: ce67a884a8304f2227c6b27e8bab0831167bc346831ff6d069028969eb05d05b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools
    - pip
    - wheel
  run:
    - python

test:
  source_files:
    - test.py
  imports:
    - durationpy
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v test.py
  requires:
    - pip
    - pytest

about:
  home: https://github.com/icholy/durationpy
  description: |
    Module for converting between datetime.timedelta and Go's Duration strings.
  summary: Module for converting between datetime.timedelta and Go's Duration strings.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/icholy/durationpy
  doc_url: https://github.com/icholy/durationpy/blob/master/README.md

extra:
  recipe-maintainers:
    - ocefpaf
